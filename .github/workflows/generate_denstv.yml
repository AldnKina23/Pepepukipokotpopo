name: Auto-update Dens.tv Playlists

on:
  schedule:
    - cron: '0 */6 * * *'  # Dijalankan otomatis setiap 6 jam
  workflow_dispatch:      # Bisa dijalankan manual lewat tombol Actions

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: Run Dens.tv Web Scraper (Official Channels)
        run: python generate_denstv.py

      - name: Run Dens.tv ID Scanner (Hidden/Extra Channels)
        run: python generate_denstv2.py

      - name: Commit and Push All M3U Playlists
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlists/
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto-update Dens.tv Playlists (Official & Scanned)"
            git pull --rebase origin main
            git push origin main
          )
