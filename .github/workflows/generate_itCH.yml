name: Generate ICCH M3U Playlist

on:
  # Berjalan otomatis setiap 6 jam sekali (Format UTC)
  schedule:
    - cron: '0 */6 * * *'
  
  # Memungkinkan kamu menjalankan workflow ini secara manual dari tab Actions di GitHub
  workflow_dispatch:

  # Berjalan otomatis ketika ada push ke branch main / master
  push:
    branches:
      - main
      - master

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Memberikan izin untuk push hasil commit ke repository

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup lingkungan Python
      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install dependency (library requests)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. Jalankan script Python
      - name: Run generate_euroTV.py
        run: |
          python generate_euroTV.py

      # 5. Commit dan Push perubahan (file output/) kembali ke repository
      - name: Commit and Push Updated Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add output/
          
          # Cek apakah ada perubahan sebelum melakukan commit
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pada playlist."
          else
            git commit -m "Auto-update playlist.m3u8 [skip ci]"
            git push
          fi
