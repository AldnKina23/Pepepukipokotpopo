name: Auto-update TV360 Vietnam Playlist

on:
  schedule:
    - cron: '0 */6 * * *'  # Berjalan0 otomatis setiap 6 jam
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install & Connect Cloudflare WARP (Bypass Geoblock)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos connect
          sleep 3
          curl -s https://www.cloudflare.com/cdn-cgi/trace | grep warp

      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: Run TV360 Generator
        run: python generate_tv360.py

      - name: Commit and Push M3U
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlists/
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto-update TV360 Vietnam playlist"
            git pull --rebase origin main
            git push origin main
          )
