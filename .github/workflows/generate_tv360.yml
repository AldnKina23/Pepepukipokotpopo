name: Auto-update TV360 Vietnam Playlist

on:
  schedule:
    - cron: '0 */6 * * *'  # Berjalan otomatis setiap 6 jam
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: Run TV360 Generator
        run: python generate_tv360.py

      - name: Commit and Push M3U
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlists/
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto-update TV360 Vietnam playlist"
            git pull --rebase origin main
            git push origin main
          )
