name: Generate TRANSMEDIA Playlist

on:
  schedule:
    # Jalan otomatis setiap jam 00:00 dan 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run M3U Generator
        run: python generate_transmedia.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add playlists/
          git diff-index --quiet HEAD || git commit -m "Auto-update Trans TV M3U playlist"
          git push
