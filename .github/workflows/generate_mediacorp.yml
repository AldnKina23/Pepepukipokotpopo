name: Extract meWATCH Streams

on:
  schedule:
    - cron: '0 */6 * * *' # Berjalan otomatis setiap 6 jam
  workflow_dispatch: # Tombol manual trigger dari Dashboard GitHub

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install chromium
        playwright install-deps

    - name: Run Extractor Script
      run: python generate_mediacorp.py

    - name: Commit and Save Results
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add mewatch_streams.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update meWATCH streams" && git push)
